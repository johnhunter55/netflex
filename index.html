<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="/src/style.css" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
    <title>netflex</title>
  </head>
  <body class="box-border flex h-full max-w-sm bg-zinc-700">
    <nav class="w-58 lg:w-64 flex flex-col p-6 bg-zinc-600 h-full">
      <div class="mb-10">
        <img class="w-35 lg:w-40" src="/netflix.png" alt="netflix logo" />
      </div>
      <div class="gap-6 flex flex-col justify-center">
      <h2 class="text-sm lg:text-base text-amber-50 flex items-center gap-4">
        <span class="material-symbols-outlined text-rose-600 text-xl lg:text-base">search</span>Browse</h2>
      <h2 class="text-sm lg:text-base text-amber-50/50 flex items-center gap-4">
        <span class="material-symbols-outlined text-amber-50/50 text-sm lg:text-base">favorite</span>Wishlist</h2>
      <h2 class="text-sm lg:text-base text-amber-50/50 flex items-center gap-4">
        <span class="material-symbols-outlined text-amber-50/50 text-sm lg:text-base">upcoming</span>Coming Soon</h2>
    </div>
    <div class="flex flex-col gap-6 mt-10">
      <h2 class="text-base lg:text-xl text-amber-50">New Trailers 🔥</h2>
      <div class="w-full flex flex-col justify-center gap-6">
        <img class="w-35 lg:w-50" src="/marty.jpg" alt="netflix show" />
        <img class="w-35 lg:w-50" src="/spider.png" alt="netflix show" />
        <img class="w-35 lg:w-50" src="/frieren.jpg" alt="netflix show" />
      </div> 
    </div>
    </nav>

    <div id="app"></div>
  </body>
</html>
