<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="/src/style.css" rel="stylesheet">
  <script type="module" src="/src/main.js"></script>
  <title>netflex</title>
</head>

<body class="box-border flex h-full max-w-sm bg-zinc-700 font-['Poppins']">
  <nav class="flex flex-col h-full bg-zinc-600/40 p-5 overflow-y-auto
            w-56 md:w-64 lg:w-72 
            gap-6 md:gap-10 lg:gap-12 no-scrollbar">

    <div>
      <img class="w-32 md:w-40 lg:w-45 mt-2" src="/netflix.png" alt="netflix logo" />
    </div>

    <div class="flex flex-col gap-4">
      <h2 class="text-amber-50 flex items-center gap-3 text-sm md:text-base">
        <span class="material-symbols-outlined text-rose-600 text-xl md:text-2xl">search</span>
        Browse
      </h2>
      <h2 class="text-amber-50/50 flex items-center gap-3 text-sm md:text-base">
        <span class="material-symbols-outlined text-sm md:text-base">favorite</span>
        Wishlist
      </h2>
      <h2 class="text-amber-50/50 flex items-center gap-3 text-sm md:text-base">
        <span class="material-symbols-outlined text-sm md:text-base">upcoming</span>
        Coming Soon
      </h2>
    </div>

    <div class="flex flex-col gap-6">
      <h2 class="text-amber-50 text-base md:text-lg lg:text-xl">New Trailers 🔥</h2>

      <div class="w-full flex flex-col items-center gap-6">

        <div class="relative w-full">
          <img class="w-full rounded-xl" src="/marty.jpg" alt="show" />
          <div
            class="flex items-center justify-between absolute bottom-0 w-full bg-stone-700/50 backdrop-blur-md rounded-b-xl px-3 py-2">
            <p class="text-amber-50 font-light text-xs md:text-sm">Marty Supreme</p>
            <span class="material-symbols-outlined text-amber-50 text-base">play_circle</span>
          </div>
        </div>

        <div class="relative w-full">
          <img class="w-full rounded-xl" src="/spider.png" alt="show" />
          <div
            class="flex items-center justify-between absolute bottom-0 w-full bg-stone-700/50 backdrop-blur-md rounded-b-xl px-3 py-2">
            <p class="text-amber-50 font-light text-xs md:text-sm">Spider-Verse</p>
            <span class="material-symbols-outlined text-amber-50 text-base">play_circle</span>
          </div>
        </div>

        <div class="relative w-full">
          <img class="w-full rounded-xl" src="/frieren.jpg" alt="show" />
          <div
            class="flex items-center justify-between absolute bottom-0 w-full bg-stone-700/50 backdrop-blur-md rounded-b-xl px-3 py-2">
            <p class="text-amber-50 font-light text-xs md:text-sm">Frieren</p>
            <span class="material-symbols-outlined text-amber-50 text-base">play_circle</span>
          </div>
        </div>

      </div>
    </div>
  </nav>

  <div id="app"></div>
</body>

</html>
